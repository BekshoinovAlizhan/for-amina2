<script>
// ===== Настройки =====

var REPLY_TEXT  = "Да! Пойдём гулять!";

var $ = function(i){ return document.getElementById(i); };
var PAL = {K:"#3a2330",O:"#f4a55b",D:"#d97b3a",W:"#fff6ea",P:"#ff8fab",C:"#7ad0ff",G:"#8d96a8",L:"#d3d9e6",Y:"#ffd23f",R:"#e8506a",N:"#6b3a1a",M:"#3b1d0a",T:"#d9a566",U:"#f0cf94",Q:"#ff6f9c",H:"#6ec55f",V:"#4b5568",a:"#9aa0a6",b:"#7d848c",v:"#9b6bff",r:"#e0243c",p:"#ffb3c9",q:"#ff8fb0",e:"#d8c3a0",f:"#b59a72",j:"#22222a",E:"#ff8a1f",k:"#383848"};
function draw(cv, s){
  var c = cv.getContext("2d"); c.clearRect(0,0,cv.width,cv.height);
  s.split(";").forEach(function(t){ if(!t) return; var a = t.slice(1).split(",").map(Number); c.fillStyle = PAL[t[0]]; c.fillRect(a[0],a[1],a[2],a[3]); });
}
var CAT0 = "K2,2,12,9;K2,0,3,3;K11,0,3,3;K4,10,8,5;K3,14,4,2;K9,14,4,2;K12,11,4,3;O3,3,10,7;P3,1,1,1;P12,1,1,1;O3,2,1,1;O12,2,1,1;O5,10,6,4;W6,11,4,3;W4,14,2,1;W10,14,2,1;O12,12,3,1;D14,12,1,1;D5,3,1,1;D7,3,2,1;D10,3,1,1;P3,7,2,1;P11,7,2,1;W6,7,4,2;P7,7,2,1;";

var JKM = "";
var JKL = "";

var FACE = {
  n:"K4,5,2,2;K10,5,2,2;W4,5,1,1;W10,5,1,1;K7,8,2,1",
  s:"K4,4,3,4;K9,4,3,4;W5,5,1,1;W10,5,1,1;K7,8,2,2;C14,4,1,2;C1,6,1,2",
  h:"K4,6,1,1;K5,5,1,1;K6,6,1,1;K9,6,1,1;K10,5,1,1;K11,6,1,1;K7,8,2,1",
  u:"K4,5,3,1;W4,6,3,1;K6,6,1,1;K9,5,3,1;W9,6,3,1;K11,6,1,1;K4,4,3,1;K9,3,3,1;K6,8,4,1",
  z:"K4,6,3,1;K9,6,3,1;K7,8,2,1",
  j:"K4,6,1,1;K5,5,1,1;K6,6,1,1;K9,6,1,1;K10,5,1,1;K11,6,1,1;K6,8,4,1;R7,9,2,1;P3,7,2,2;P11,7,2,2",
  m:"K4,5,2,2;K10,5,2,2;W4,5,1,1;W10,5,1,1;K6,8,1,1;K9,8,1,1;K7,9,2,1",
  b:"K4,6,2,1;K10,6,2,1;K6,8,1,1;K9,8,1,1;K7,9,2,1",

  sad:"K4,6,2,2;K10,6,2,2;W4,6,1,1;W10,6,1,1;K4,4,2,1;K6,3,1,1;K10,4,2,1;K9,3,1,1;C4,8,1,2;C11,8,1,2;K6,9,1,1;K7,8,2,1;K9,9,1,1"
};
var HEART = "Q1,0,2,1;Q4,0,2,1;Q0,1,7,2;Q1,3,5,1;Q2,4,3,1;Q3,5,1,1;W1,1,1,1";
var HEARTY = "Y1,0,2,1;Y4,0,2,1;Y0,1,7,2;Y1,3,5,1;Y2,4,3,1;Y3,5,1,1;W1,1,1,1";
var HEARTR = "r1,0,2,1;r4,0,2,1;r0,1,7,2;r1,3,5,1;r2,4,3,1;r3,5,1,1;W1,1,1,1";
var HEARTV = "v1,0,2,1;v4,0,2,1;v0,1,7,2;v1,3,5,1;v2,4,3,1;v3,5,1,1;W1,1,1,1";
var COLA = "K1,0,4,2;K1,2,4,2;K0,4,6,8;M1,5,4,6;R0,6,6,3;W1,7,4,1;W1,5,1,1;G1,0,4,1";
var GLOVE = "K1,0,7,6;K0,2,2,3;r2,1,5,4;W3,1,2,1;W0,3,1,1";
var GUITAR = "K0,1,6,4;K1,0,4,1;K1,5,4,1;T1,1,4,4;N2,2,2,2;K6,1,6,1;K6,4,6,1;N6,2,6,2;K11,0,1,5";
var AMINA = CAT0.replace(/O/g, "p").replace(/D/g, "q") + "R6,0,1,2;R9,0,1,2;R7,1,2,1;" + JKM;
draw($("cat0"), CAT + FACE.h); draw($("cat"), CAT + FACE.m); draw($("cola"), COLA); draw($("gprop"), vert(GUITAR)); draw($("glove"), GLOVE); draw($("guitar"), GUITAR);
draw($("aknur"), kitPal("aknur") + FACE.m); draw($("alem"), kitPal("alem") + FACE.h); draw($("amina"), AMINA + FACE.m);

// ===== Звук (8-бит) =====
var ctx, master, sfx, timer, step = 0, tempo = 240, muted = false, paused = false;
var SC = [261.63,293.66,329.63,392,440,523.25,587.33,659.25];
var SEQ = [0,2,4,2,5,4,2,1,0,2,4,5,7,5,4,2], ROOTS = [130.81,110,87.31,98];
function note(f,t,l,v,type){
  var o = ctx.createOscillator(), g = ctx.createGain(); o.type = type; o.frequency.value = f;
  g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(0.001,t+l); o.connect(g); g.connect(master); o.start(t); o.stop(t+l+0.02);
}
function tick(){
  if (!ctx || muted || paused) return;
  var t = ctx.currentTime + 0.02;
  note(SC[SEQ[step%16]], t, 0.3, 0.5, "square");
  if (step%8 === 0) note(ROOTS[(step/8|0)%4], t, 1.2, 0.9, "triangle");
  step++;
}
function blip(f,l,v,to){
  if (!ctx || muted) return;
  var t = ctx.currentTime, o = ctx.createOscillator(), g = ctx.createGain(); o.type = "square"; o.frequency.setValueAtTime(f,t);
  if (to) o.frequency.exponentialRampToValueAtTime(to,t+l);
  g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(0.001,t+l); o.connect(g); g.connect(sfx); o.start(t); o.stop(t+l);
}
function boomSound(){
  if (!ctx || muted) return;
  var n = ctx.sampleRate*1.2, b = ctx.createBuffer(1,n,ctx.sampleRate), d = b.getChannelData(0);
  for (var i=0;i<n;i++) d[i] = (Math.random()*2-1)*Math.pow(1-i/n,2);
  var s = ctx.createBufferSource(), f = ctx.createBiquadFilter(); s.buffer = b; f.type = "lowpass"; f.frequency.value = 900; s.connect(f); f.connect(sfx); s.start();
}
function setTempo(ms){ clearInterval(timer); tempo = ms; timer = setInterval(tick, tempo); }
function startMusic(){
  try{
    try{ if (navigator.audioSession) navigator.audioSession.type = "playback"; }catch(e){}
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    master = ctx.createGain(); master.gain.value = 0.07; var lp = ctx.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 2200;
    master.connect(lp); lp.connect(ctx.destination); sfx = ctx.createGain(); sfx.gain.value = 0.3; sfx.connect(ctx.destination);
    if (ctx.resume) ctx.resume(); timer = setInterval(tick, tempo);
  }catch(e){}
}
$("mute").onclick = function(){ muted = !muted; this.textContent = muted ? "×" : "♪"; this.setAttribute("aria-label", muted ? "Включить музыку" : "Выключить музыку"); };

// ===== Игра =====
var catw = $("catw"), no = $("no"), yes = $("yes");
var phase = "intro", idleT, asleep = false, prevSub = "", catMotion = "jump3";

// котик засыпает после 20 секунд бездействия
function armIdle(){ clearTimeout(idleT); if (phase !== "boom") idleT = setTimeout(sleep, 20000); }
function sleep(){
  if (phase === "boom" || asleep) return;
  asleep = true;
  if (phase === "intro"){ draw($("cat0"), CAT + FACE.z); $("zzz0").classList.remove("hidden"); return; }
  if (phase === "ask"){ prevSub = $("sub").textContent; $("sub").textContent = "Котик снова уснул, не дождавшись ответа..."; }
  catw.className = "spr"; draw($("cat"), CAT + FACE.z); $("zzz").classList.remove("hidden"); sleepKits();
}
function wake(){
  if (!asleep) return;
  asleep = false; $("zzz").classList.add("hidden"); $("zzz0").classList.add("hidden");
  if (phase === "intro"){ draw($("cat0"), CAT + FACE.h); return; }
  if (phase === "ask"){
    $("sub").textContent = prevSub; draw($("cat"), CAT + FACE.m);
  } else { catw.className = "spr " + catMotion; draw($("cat"), CAT + FACE.h); wakeKits(); }
}
function touchAct(){ wake(); armIdle(); }
["pointerdown","keydown","touchstart"].forEach(function(ev){ document.addEventListener(ev, touchAct, true); });
armIdle();
catw.addEventListener("click", function(){
  if (phase === "boom") return;
  if (phase === "ask" && !lettersDone){ letterStep(); return; }
  if (phase === "yes" && !seqDone){ seqStep(); return; }
  blip(780,0.14,0.4,540); setTimeout(function(){ blip(620,0.16,0.35,420); }, 150);
  if (phase === "yes") hearts(5); else retrigger(catw, "hop");
  taps++; if (taps % 5 === 0) secret();
});

// секретная пасхалка: каждые 10 тапов по котику
var taps = 0, tenderI = 0, TENDER = ["Амина очень красивая и милая!", "С именем Амина часто ассоциируют доброту, искренность, спокойствие и заботливость.", "Кстати, имя Амина означает «верная», «надёжная», «честная», а ещё «находящаяся в безопасности».", "Знаю, что у Акнур дела идут отлично!", "Помнишь, ты жаловалась, что самая низкая? Ещё сделала репост одного такого поста в ВК.", "А ещё у тебя была на аватарке Алиса из мультфильма «Алиса в Стране чудес».", "Амина чудесная девушка!", "Если бы ты родилась в июне, то датой твоего рождения было бы 06.06.06."];

function bang(cx, cy){
  boomSound();
  var COL = ["#ffffff","#ffd23f","#ff8a1f","#e8452c","#555555","#888888"];
  for (var i=0;i<44;i++){
    var s = document.createElement("div"), sz = 8 + 4*Math.floor(Math.random()*4);
    s.className = "pix"; s.style.cssText += "left:" + cx + "px;top:" + cy + "px;width:" + sz + "px;height:" + sz + "px;background:" + COL[i % COL.length];
    document.body.appendChild(s);
    var dx = Math.random()*340 - 170, dy = Math.random()*-260 + 60;
    var a = s.animate([{transform:"translate(0,0)",opacity:1},{transform:"translate(" + dx + "px," + dy + "px)",opacity:1,offset:.6},{transform:"translate(" + dx*1.1 + "px," + (dy + 220) + "px)",opacity:0}], {duration:900 + Math.random()*500, easing:"steps(9)", fill:"forwards"});
    a.onfinish = (function(el){ return function(){ el.remove(); }; })(s);

function bigCat(face, joy, hold, done){

  function tf(x,y,s,r){ return "translate(" + x + "px," + y + "px) scale(" + s + ") rotate(" + r + "deg)"; }
  var total = hold + 1400, a = 700/total, b = 1 - a, E = "steps(6)", m = joy ? (joy > 2 ? 10 : joy > 1 ? 6 : 4) : 0;

  for (i=1;i<=m;i++) fr.push({transform:tf(0, i%2 ? -36 : 0, joy > 2 && i%2 ? 1.12 : 1, joy > 1 ? i*R/m : 0), offset:a + (b-a)*i/(m+1), easing:E});
  fr.push({transform:tf(0,0,1,R), offset:b, easing:E}, {transform:tf(dx,dy,sc,R), offset:1});
  var bgf = [{opacity:0,offset:0},{opacity:1,offset:a},{opacity:1,offset:b},{opacity:0,offset:1}];

    var cols = ["#ffd23f","#7ad0ff","#b8ff8a","#ff8fab","#c9a7ff","#ffb347","#7ad0ff","#ffd23f"];

    bgf.push({opacity:1,backgroundColor:"#96D7EE",offset:b},{opacity:0,offset:1});
  }
